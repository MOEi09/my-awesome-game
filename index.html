<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Novel Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #07070a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
    }

    /* กรอบหน้าจอเกมสัดส่วน 16:9 (1920x1080) */
    #game-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 Aspect Ratio */
      max-height: 100vh;
      max-width: 177.78vh;
      background-color: #000;
      overflow: hidden;
      box-shadow: 0 0 45px rgba(0, 0, 0, 0.95);
    }

    /* แถบ HUD วัดความรู้ด้านบน */
    .hud-header {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(18, 18, 30, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
      transition: all 0.4s ease;
    }

    .hud-icon {
      font-size: 22px;
      color: #ffd700;
      display: flex;
      align-items: center;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5));
    }

    .progress-bar-container {
      width: 220px;
      height: 12px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899, #3b82f6);
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .info-btn-wrapper {
      position: relative;
    }

    .info-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .info-btn:hover {
      background: #ec4899;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.8);
    }

    .tooltip {
      position: absolute;
      top: 34px;
      right: 0;
      background: rgba(15, 15, 25, 0.95);
      color: #fff;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .info-btn-wrapper:hover .tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* ปุ่ม Home ด้านบนซ้าย */
    .home-btn {
      position: absolute;
      top: 18px;
      left: 24px;
      width: 48px;
      height: 48px;
      z-index: 100;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    .home-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .home-btn:hover {
      transform: scale(1.12);
      filter: drop-shadow(0 0 16px rgba(236, 72, 153, 0.8));
    }

    /* ข้อความ ( แตะ ) ลางๆ กลางจอเมื่อผู้เล่นค้างเกิน 4 วินาที */
    .center-tap-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      z-index: 95;
      font-size: 26px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95), 0 0 22px rgba(236, 72, 153, 0.7);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
    }

    .center-tap-hint.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: tapSoftPulse 2.4s infinite ease-in-out;
    }

    @keyframes tapSoftPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(0.97); opacity: 0.65; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.95; }
    }

    /* เลเยอร์แสงสีขาววาบสลับฉาก (White Flash Layer) */
    .white-flash-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .white-flash-layer.active {
      opacity: 1;
    }

    .scene-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transform: scale(1);
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      will-change: opacity, transform;
      z-index: 10;
    }

    .scene-bg.active {
      opacity: 1;
      pointer-events: auto;
    }

    .scene-bg.zoom-out-fade {
      opacity: 0;
      transform: scale(1.15);
    }

    .scene-bg.instant-change {
      transition: none !important;
    }

    /* เลือกเพศ */
    .gender-select-container {
      position: absolute;
      bottom: 6%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gender-select-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .gender-select-wrapper {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gender-btn {
      width: 250px;
      height: auto;
      max-width: 38%;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6));
    }

    .gender-btn:hover {
      transform: scale(1.12);
      filter: drop-shadow(0 12px 28px rgba(236, 72, 153, 0.75));
    }

    /* ตัวละคร ปกรณ์ (960x1080 ชิดขวา) */
    .character-pakorn {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      object-fit: fill;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .character-pakorn.active {
      opacity: 1;
    }

    /* จอมือถือทับฉาก */
    .phone-screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .phone-screen-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ตารางแอปบนมือถือ */
    .app-icons-grid {
      position: absolute;
      top: 38%;
      left: 5.2%;
      width: 29.5%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 12px;
      justify-items: center;
      align-items: center;
    }

    .app-icon {
      width: 68%;
      height: auto;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
    }

    .app-icon:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 6px 18px rgba(255, 255, 255, 0.95));
    }

    /* จอน้อย Pop-up */
    .popup-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 60;
      opacity: 0;
      transform: translateY(12%);
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .popup-screen.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      cursor: pointer;
    }

    .choice-group-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 95%;
      z-index: 70;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .choice-group-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .choice-btn-item {
      width: 100%;
      max-width: 1750px;
      height: auto;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease, opacity 0.3s ease;
      filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.65));
    }

    .choice-btn-item:hover {
      transform: scale(1.04);
      filter: drop-shadow(0 10px 25px rgba(236, 72, 153, 0.8));
    }

    .choice-btn-item.disabled {
      opacity: 0.45;
      pointer-events: none;
      filter: grayscale(0.8) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
    }

    /* แถบข้อความด้านล่าง */
    .textbox-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 39.8%;
      z-index: 80;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .textbox-container.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .textbox-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* ปุ่มนำทางซ้าย-กลาง-ขวา */
    .nav-buttons-container {
      position: absolute;
      bottom: 5%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .nav-buttons-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-btn-slot {
      width: 33.33%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-btn {
      max-width: 220px;
      width: 80%;
      height: auto;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 18px rgba(255, 255, 255, 0.65));
      animation: btnSmoothGlow 2.5s infinite ease-in-out;
    }

    @keyframes btnSmoothGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 14px rgba(236, 72, 153, 0.55)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 25px rgba(255, 255, 255, 0.95)); }
    }

    .nav-btn:hover {
      transform: scale(1.22) !important;
      filter: drop-shadow(0 12px 28px rgba(236, 72, 153, 0.95)) drop-shadow(0 0 32px rgba(255, 255, 255, 1)) !important;
    }

    /* ปุ่มพูดคุย */
    .talk-btn {
      position: absolute;
      top: 30.83%;
      left: 61.00%;
      width: 14%;
      max-width: 220px;
      height: auto;
      z-index: 45;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.6));
    }

    .talk-btn.visible-disabled {
      opacity: 0.7;
      pointer-events: none;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5)) grayscale(0.5);
    }

    .talk-btn.interactive {
      opacity: 1;
      pointer-events: auto;
      animation: talkPulse 2s infinite ease-in-out;
    }

    @keyframes talkPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 8px 20px rgba(236, 72, 153, 0.7)) drop-shadow(0 0 15px rgba(255, 255, 255, 0.8)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 12px 28px rgba(236, 72, 153, 0.95)) drop-shadow(0 0 25px rgba(255, 255, 255, 1)); }
    }

    #battle-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 90;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #battle-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .battle-start-title {
      font-size: 72px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px #ec4899, 0 0 40px #a855f7, 0 6px 18px rgba(0,0,0,0.9);
      letter-spacing: 6px;
      cursor: pointer;
      animation: startGlowPulse 1.5s infinite ease-in-out;
    }

    @keyframes startGlowPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.12); opacity: 1; text-shadow: 0 0 30px #ec4899, 0 0 60px #ec4899; }
    }

    /* ป้ายคะแนนมินิเกมย้ายไปฝั่งขวาบน (Opposite Side) */
    .battle-score-hud {
      position: absolute;
      top: 25px;
      right: 30px;
      left: auto;
      z-index: 95;
      background: rgba(10, 10, 20, 0.85);
      border: 2px solid rgba(236, 72, 153, 0.8);
      border-radius: 20px;
      padding: 10px 22px;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
      display: none;
    }

    .battle-score-hud.active {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .battle-floating-item {
      position: absolute;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      transition: transform 0.1s ease;
      white-space: nowrap;
      z-index: 92;
    }

    .battle-floating-item:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>

  <div id="game-container">
    
    <!-- แถบ HUD วัดความรู้ด้านบน -->
    <div class="hud-header">
      <div class="hud-icon">📖</div>
      <div class="progress-bar-container">
        <div id="knowledge-bar" class="progress-bar-fill"></div>
      </div>
      <div class="info-btn-wrapper">
        <div class="info-btn">!</div>
        <div class="tooltip">แก้ปัญหาภายในเกมได้ แถบวัดความรู้จะขยับขึ้น</div>
      </div>
    </div>

    <!-- ปุ่ม Home กลับหน้าหลัก (มุมซ้ายบน) -->
    <img id="btn-home" class="home-btn" src="https://lh3.googleusercontent.com/d/14c-gOWytS0Wvy_smrsTLus4esDrhOVcj" alt="หน้าแรก" onclick="handleHomeButtonClick(event)">

    <!-- ข้อความ ( แตะ ) ลางๆ กลางจอเมื่อผู้เล่นค้างเกิน 4 วินาที -->
    <div id="center-tap-hint" class="center-tap-hint">( แตะ )</div>

    <!-- เลเยอร์แสงสีขาวสลับฉาก -->
    <div id="white-flash" class="white-flash-layer"></div>

    <!-- ฉากพื้นหลังหลักต่างๆ -->
    <div id="scene-0" class="scene-bg active" style="background-image: url('https://lh3.googleusercontent.com/d/1Lk0CVOXS70d9zYJ-lg2F5glhiQ_YOWiT'); cursor: pointer;"></div>
    <div id="scene-sp1" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1Kuzs9rpu0M5NScCdeTSl9dAZEa2aLmjP');"></div>
    <div id="scene-sp2" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1l0LxDM6bw6FYo4xN_cWEOzM8UfIOyvS4');">
      <div id="gender-select" class="gender-select-container">
        <div class="gender-select-wrapper">
          <img src="https://lh3.googleusercontent.com/d/1_kb6brYLqRotQ1OS0Z-DHF5_ybcRouY4" class="gender-btn" alt="เพศชาย" onclick="selectGender('male')">
        </div>
        <div class="gender-select-wrapper">
          <img src="https://lh3.googleusercontent.com/d/1yT_wmTzzaZWrcXI1vRfB8zlxxqABtdxM" class="gender-btn" alt="เพศหญิง" onclick="selectGender('female')">
        </div>
      </div>
    </div>

    <div id="scene-1" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1XitV2u7G101fAkArm4iZja-E-Zn1sIte'); cursor: pointer;"></div>
    <div id="scene-2" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/17Er8rltYRMEcZrDkiJXi6khZ2DxeSVOy'); cursor: pointer;"></div>
    <div id="scene-3" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1MkVKMxnON9c0BBO0B544jEeUgx6AHzC-'); cursor: pointer;"></div>
    <div id="scene-4" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1aUIvEEm4WdVxR6a34qSuKUP9t5p7lUuP'); cursor: pointer;"></div>
    <div id="scene-6" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1JXQa4HTXdUYG7ou90LBHsRZ1PTcF9B9b'); cursor: pointer;"></div>

    <!-- ฉากทางฝั่งซ้าย -->
    <div id="scene-left1" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/19vPu5aoFrebQdm1DtzvciBHaySg4OJxt'); cursor: pointer;"></div>
    <div id="scene-left2" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1R8i9bZv4Gpqyvv5972rX8UDL-IkKpJOF'); cursor: pointer;"></div>

    <!-- ฉากเพิ่มเติมตามเนื้อเรื่องใหม่ -->
    <div id="scene-end1" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1d09NSfEhvtgQNhvawJia8pnquEam6v9m'); cursor: pointer;"></div>
    <div id="scene-battle" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1bjZxiZLWUYRZmDnNtJCmjJaJ7PNXyhHC');"></div>
    <div id="scene-cutscene-male" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/180pshb-vV-qmrluZ3zXmDR4n8Zax26Bo'); cursor: pointer;"></div>
    <div id="scene-cutscene-female" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/13JkiphKhIn9eL2xbeXK9BihxLejVpkLp'); cursor: pointer;"></div>

    <!-- จอมือถือภารกิจ 1 & 2 -->
    <div id="phone-screen-1" class="phone-screen-overlay" style="background-image: url('https://lh3.googleusercontent.com/d/12a9H6WrV2NlJoaPaEsNX0WXhUtxBrG7e');">
      <div class="app-icons-grid">

        currentStep = 'TXT_4_SCENE_3';
      }
      else if (currentStep === 'TXT_4_SCENE_3') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1gNsteHUVNCqlTG5UBX2fVVG2OWV2kdja';
        currentStep = 'TXT_5';
      }
      else if (currentStep === 'TXT_5') {
        textbox.classList.remove('active');
        scene3.classList.remove('active');
        scene4.classList.add('active');
        currentStep = 'WAIT_AUTO_SCENE_4';
        isTransitioning = true;

        setTimeout(() => {
          currentStep = 'SCENE_4_WAIT';
          isTransitioning = false;
          resetIdleTimer();
        }, 4000);
      }
      else if (currentStep === 'TXT_6') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1UejuctKbYKqiwwDNj-95z4ObYyp3kR_U';
        currentStep = 'TXT_7';
      }
      else if (currentStep === 'TXT_7') {
        scene4.classList.add('instant-change');
        scene4.classList.remove('active');
        scene3.classList.add('instant-change');
        scene3.classList.add('active');

        setTimeout(() => {
          scene4.classList.remove('instant-change');
          scene3.classList.remove('instant-change');
        }, 50);

        currentStep = 'TXT_7_SCENE_3';
      }
      else if (currentStep === 'TXT_7_SCENE_3') {
        textbox.classList.remove('active');
        scene3.classList.remove('active');
        scene2.classList.add('active');

        btnLeft.style.display = 'none';
        btnRight.style.display = 'none';
        btnMiddle.style.display = 'block';
        navButtons.classList.add('active');

        currentStep = 'SCENE_2_MIDDLE_BTN';
      }
      // ทางฝั่งซ้าย
      else if (currentStep === 'TXT_LEFT_1') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1RxIsG2xfq7nR9bM4Zz5dsKjmgL_In1rE';
        currentStep = 'TXT_LEFT_2';
      }
      else if (currentStep === 'TXT_LEFT_2') {
        textbox.classList.remove('active');
        btnTalk.classList.remove('visible-disabled');
        btnTalk.classList.add('interactive');
        currentStep = 'TALK_BTN_READY';
      }
      else if (currentStep === 'TXT_LEFT_3') {
        textbox.classList.remove('active');
        charPakorn.src = 'https://lh3.googleusercontent.com/d/1awrxzz7Xyd6VrOV8b2zoLBmz3o8OH_tA';
        currentStep = 'LEFT_BRANCH_PAKORN_NORMAL_1';
      }
      else if (currentStep === 'TXT_LEFT_4') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1AuQQJlo1B1og7hNEoUBFP5j0TzcanwBB';
        charPakorn.src = 'https://lh3.googleusercontent.com/d/1yVHMdPfZKDjswa0kHjVTQ3qlunJtsyjm';
        currentStep = 'TXT_LEFT_5';
      }
      else if (currentStep === 'TXT_LEFT_5') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1uMBohQwM_n512oPv4hizsD0S7si7zYYi';
        charPakorn.src = 'https://lh3.googleusercontent.com/d/1awrxzz7Xyd6VrOV8b2zoLBmz3o8OH_tA';
        currentStep = 'TXT_LEFT_6';
      }
      else if (currentStep === 'TXT_LEFT_6') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1lP2e_ZiwEHh36SGCPpvJCjJRR2RyxhzV';
        currentStep = 'TXT_LEFT_7';
      }
      else if (currentStep === 'TXT_LEFT_7') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1FeW5eMcocC8iBIfFfxEnLZTWuBcnDi3d';
        currentStep = 'TXT_LEFT_END';
      }
      else if (currentStep === 'TXT_LEFT_END') {
        textbox.classList.remove('active');
        showTLChoices();
      }
      else if (currentStep === 'TXT_QUESTION_TL') {
        textbox.classList.remove('active');
        charPakorn.classList.remove('active');

        if (activeChoiceBranch === 1) {
          phoneScreen1.classList.add('active');
        } else if (activeChoiceBranch === 2) {
          phoneScreen2.classList.add('active');
        }

        currentStep = 'WAIT_APP_SELECTION';
      }
      else if (currentStep === 'WRONG_APP_MSG') {
        clearTimeout(wrongAppTimer);
        textbox.classList.remove('active');
        currentStep = 'WAIT_APP_SELECTION';
      }
      else if (currentStep === 'TXT_TL1_CORRECT_1') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/19s4BKLbNuOqJEw6SSfKmEEVY2_Mi25c-';
        currentStep = 'TXT_TL1_CORRECT_2';
      }
      else if (currentStep === 'TXT_TL1_CORRECT_2') {
        textbox.classList.remove('active');
        popupScreen1.classList.remove('active');
        phoneScreen1.classList.remove('active');

        completedChoice1 = true;
        updateKnowledgeBar(50);

        setTimeout(() => {
          charPakorn.classList.add('active');
          checkChoiceCompletion();
        }, 500);
      }
      else if (currentStep === 'TXT_TL2_CORRECT_1') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1n3Uhf75eITtQeE9Eayd8OqhNFJ2LsIlX';
        currentStep = 'TXT_TL2_CORRECT_2';
      }
      else if (currentStep === 'TXT_TL2_CORRECT_2') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/17ViaK3xMirpKrlYKVNGEc03Db-s82v4m';
        currentStep = 'TXT_TL2_CORRECT_3';
      }
      else if (currentStep === 'TXT_TL2_CORRECT_3') {
        textbox.classList.remove('active');
        popupScreen2.classList.remove('active');
        phoneScreen2.classList.remove('active');

        completedChoice2 = true;
        updateKnowledgeBar(50);

        setTimeout(() => {
          charPakorn.classList.add('active');
          checkChoiceCompletion();
        }, 500);
      }
      else if (currentStep === 'FINAL_TXT_BEFORE_CHOICES') {
        textbox.classList.remove('active');
        newBranchChoices.classList.add('active');
        currentStep = 'SHOW_NEW_BRANCH_CHOICES';
      }
      // ----- เนื้อเรื่องส่วนตัวเลือกที่ 1 -----
      else if (currentStep === 'TXT_NEW_BRANCH_1_1') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1xoPS3J3vHigPjcIOouMo8zmUGc3hMIJZ';
        charPakorn.src = 'https://lh3.googleusercontent.com/d/1yVHMdPfZKDjswa0kHjVTQ3qlunJtsyjm';
        currentStep = 'TXT_NEW_BRANCH_1_2';
      }
      else if (currentStep === 'TXT_NEW_BRANCH_1_2') {
        textbox.classList.remove('active');
        charPakorn.classList.remove('active');
        triggerWhiteFlashTransition(() => {
          sceneLeft2.classList.remove('active');
          sceneEnd1.classList.add('active');
          currentStep = 'SCENE_END1_READY';
        });
      }
      else if (currentStep === 'TXT_END1_1') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1TRqkXGiYZMDxEu_feTVjblu6mkpa6Yd4';
        currentStep = 'TXT_END1_2';
      }
      else if (currentStep === 'TXT_END1_2') {
        textbox.classList.remove('active');
        triggerWhiteFlashTransition(() => {
          sceneEnd1.classList.remove('active');
          sceneLeft2.classList.add('active');
          currentStep = 'FINAL_CONCLUSION_REACHED';
        });
      }
      // ----- เนื้อเรื่องส่วนตัวเลือกที่ 2 -----
      else if (currentStep === 'TXT_NEW_BRANCH_2_1') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1PVTLSehn7PfIuaM9GB1jEflubF3U9z1V';
        charPakorn.src = 'https://lh3.googleusercontent.com/d/1IlNHrs-Y3-KGzqYFLhPfrLsZsLrHlboy';
        currentStep = 'TXT_NEW_BRANCH_2_2';
      }
      else if (currentStep === 'TXT_NEW_BRANCH_2_2') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1OrmrcPSVDzZPz3Rnnz4oYDBvv9dDVPP8';
        currentStep = 'TXT_NEW_BRANCH_2_3';
      }
      else if (currentStep === 'TXT_NEW_BRANCH_2_3') {
        textbox.classList.remove('active');
        charPakorn.classList.remove('active');
        triggerWhiteFlashTransition(() => {
          sceneLeft2.classList.remove('active');
          sceneBattle.classList.add('active');
          battleOverlay.classList.add('active');
          battleStartTxt.style.display = 'block';
          currentStep = 'BATTLE_START_WAIT';
        });
      }
      // ----- เนื้อเรื่องกรณีชนะมินิเกม -----
      else if (currentStep === 'TXT_CUTSCENE_1') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1JFrkUBuNVi3stpA73362NLLVSHwuZakT';
        currentStep = 'TXT_CUTSCENE_2';
      }
      else if (currentStep === 'TXT_CUTSCENE_2') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1TRqkXGiYZMDxEu_feTVjblu6mkpa6Yd4';
        currentStep = 'TXT_CUTSCENE_3';
      }
      else if (currentStep === 'TXT_CUTSCENE_3') {
        textbox.classList.remove('active');
        triggerWhiteFlashTransition(() => {
          sceneCutsceneMale.classList.remove('active');
          sceneCutsceneFemale.classList.remove('active');
          sceneLeft2.classList.add('active');
          currentStep = 'FINAL_CONCLUSION_REACHED';
        });
      }
    }

    function triggerWhiteFlashTransition(callback) {
      isTransitioning = true;
      whiteFlash.classList.add('active');
      setTimeout(() => {
        if (callback) callback();
        setTimeout(() => {
          whiteFlash.classList.remove('active');
          isTransitioning = false;
          resetIdleTimer();
        }, 300);
      }, 700);
    }

    function showTLChoices() {
      currentStep = 'SHOW_TL_CHOICES';
      btnTl1.classList.toggle('disabled', completedChoice1);
      btnTl2.classList.toggle('disabled', completedChoice2);
      tlChoices.classList.add('active');
    }

    function handleChoiceTL(choiceNum) {
      if (isTransitioning) return;
      if (choiceNum === 1 && completedChoice1) return;
      if (choiceNum === 2 && completedChoice2) return;

      activeChoiceBranch = choiceNum;
      tlChoices.classList.remove('active');

      setTimeout(() => {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1gCxxcGNJww9_a8wVNveWP63PCd3x570U';
        textbox.classList.add('active');
        currentStep = 'TXT_QUESTION_TL';
      }, 400);
    }

    function handleAppClick(branch, appNum) {
      if (isTransitioning || currentStep !== 'WAIT_APP_SELECTION') return;

      if (branch === 1) {
        if (appNum === 3) {
          popupScreen1.classList.add('active');
          currentStep = 'WAIT_TAP_FOR_POPUP1_TEXTBOX';
        } else {
          showWrongAppNotice();
        }
      } 
      else if (branch === 2) {
        if (appNum === 2) {
          popupScreen2.classList.add('active');
          currentStep = 'WAIT_TAP_FOR_POPUP2_TEXTBOX';
        } else {
          showWrongAppNotice();
        }
      }
    }

    function handlePopupClick(popupNum) {
      if (isTransitioning) return;

      if (popupNum === 1 && currentStep === 'WAIT_TAP_FOR_POPUP1_TEXTBOX') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1pnhZ0aiy7JYPgEF-JiuTsUxA5Tk7djdK';
        textbox.classList.add('active');
        currentStep = 'TXT_TL1_CORRECT_1';
      }
      else if (popupNum === 2 && currentStep === 'WAIT_TAP_FOR_POPUP2_TEXTBOX') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1RLnopjABjKI5OtN42fucpA8fZ1SC9zr3';
        textbox.classList.add('active');
        currentStep = 'TXT_TL2_CORRECT_1';
      }
    }

    function showWrongAppNotice() {
      textboxImg.src = 'https://lh3.googleusercontent.com/d/10cfQvccibUCVWX3dsS8DXqeenMqDRgzx';
      textbox.classList.add('active');
      currentStep = 'WRONG_APP_MSG';

      clearTimeout(wrongAppTimer);
      wrongAppTimer = setTimeout(() => {
        if (currentStep === 'WRONG_APP_MSG') {
          textbox.classList.remove('active');
          currentStep = 'WAIT_APP_SELECTION';
        }
      }, 2000);
    }

    function checkChoiceCompletion() {
      if (completedChoice1 && completedChoice2) {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1CBfWBhQVU9kPGLcTGsK9v_K6NB5xvKdn';
        textbox.classList.add('active');
        currentStep = 'FINAL_TXT_BEFORE_CHOICES';
      } else {
        showTLChoices();
      }
    }

    function handleNewBranchChoice(choiceNum) {
      if (isTransitioning || currentStep !== 'SHOW_NEW_BRANCH_CHOICES') return;
      currentBranchPath = choiceNum;
      newBranchChoices.classList.remove('active');

      if (choiceNum === 1) {
        setTimeout(() => {
          textboxImg.src = 'https://lh3.googleusercontent.com/d/1c5Pf5QLYaYLihT01uY-v5opfYctqx58g';
          textbox.classList.add('active');
          currentStep = 'TXT_NEW_BRANCH_1_1';
        }, 400);
      } 
      else if (choiceNum === 2) {
        setTimeout(() => {
          textboxImg.src = 'https://lh3.googleusercontent.com/d/1zvp5CM6rjIKL2DG6drOZ7X9cQw1RU51O';
          textbox.classList.add('active');
          currentStep = 'TXT_NEW_BRANCH_2_1';
        }, 400);
      }
    }

    // คำตอบที่ถูกต้อง ( target: true ) เป็นข้อความเชิงป้องกัน เช่น "ไม่บอก..." / "ไม่ส่ง..." และแสดงผลสีแดง (#ef4444)
    const itemData = [
      { text: "ไม่บอกที่อยู่", target: true, color: "#ef4444" },
      { text: "ไม่ส่งรูปตัวเอง", target: true, color: "#ef4444" },
      { text: "ไม่สร้างวิดีโอด้วยเสียงจริง", target: true, color: "#ef4444" },
      { text: "ไม่บอกรหัสผ่าน", target: true, color: "#ef4444" },
      { text: "ไม่บอกเลขบัตรประชาชน", target: true, color: "#ef4444" },
      { text: "ไม่บอกเลขบัญชีธนาคาร", target: true, color: "#ef4444" },
      { text: "ไม่ส่งเบอร์โทรศัพท์", target: true, color: "#ef4444" },
      { text: "ไม่ให้วันเดือนปีเกิด", target: true, color: "#ef4444" },
      { text: "บอกที่อยู่บ้าน", target: false, color: "#10b981" },
      { text: "ส่งรูปถ่ายตัวเอง", target: false, color: "#3b82f6" },
      { text: "บอกรหัสผ่าน ATM", target: false, color: "#8b5cf6" },
      { text: "บอกเลขบัญชีธนาคาร", target: false, color: "#06b6d4" },
      { text: "สร้างคลิปเสียงจริง", target: false, color: "#f97316" },
      { text: "บอกเลขบัตรประชาชน", target: false, color: "#ec4899" },
      { text: "ชอบกินส้มตำ", target: false, color: "#a855f7" },
      { text: "ทักทายสวัสดี", target: false, color: "#14b8a6" }
    ];

    function startBattleMinigame() {
      if (isBattleActive) return;
      isBattleActive = true;
      battleScore = 0;
      battleLives = 3;
      battleScoreVal.innerText = battleScore;
      battleLivesVal.innerText = battleLives;

      battleStartTxt.style.display = 'none';
      battleScoreHud.classList.add('active');

      battleInterval = setInterval(spawnFloatingItem, 900);
    }

    function spawnFloatingItem() {
      if (!isBattleActive) return;

      const randomData = itemData[Math.floor(Math.random() * itemData.length)];
      const itemEl = document.createElement('div');
      itemEl.className = 'battle-floating-item';
      itemEl.innerText = randomData.text;
      itemEl.style.backgroundColor = randomData.color;

      const randomX = Math.floor(Math.random() * 65) + 15;
      itemEl.style.left = randomX + '%';
      itemEl.style.bottom = '-60px';

      gameContainer.appendChild(itemEl);

      let posY = -60;
      const speed = 2.8 + Math.random() * 1.5;

      const moveTimer = setInterval(() => {
        if (!isBattleActive) {
          clearInterval(moveTimer);
          if (itemEl.parentNode) itemEl.parentNode.removeChild(itemEl);
          return;
        }

        posY += speed;
        itemEl.style.bottom = posY + 'px';

        if (posY > gameContainer.offsetHeight - 50) {
          clearInterval(moveTimer);
          if (itemEl.parentNode) itemEl.parentNode.removeChild(itemEl);

          if (randomData.target) {
            handleBattleMistake();
          }
        }
      }, 20);

      itemEl.onclick = (e) => {
        e.stopPropagation();
        clearInterval(moveTimer);
        if (itemEl.parentNode) itemEl.parentNode.removeChild(itemEl);

        if (randomData.target) {
          battleScore++;
          battleScoreVal.innerText = battleScore;
          if (battleScore >= 10) {
            finishBattleMinigame(true);
          }
        } else {
          handleBattleMistake();
        }
      };
    }

    function handleBattleMistake() {
      battleLives--;
      battleLivesVal.innerText = battleLives;
      if (battleLives <= 0) {
        finishBattleMinigame(false);
      }
    }

    function finishBattleMinigame(isWin) {
      isBattleActive = false;
      clearInterval(battleInterval);
      battleScoreHud.classList.remove('active');
      battleOverlay.classList.remove('active');

      document.querySelectorAll('.battle-floating-item').forEach(el => el.remove());

      if (isWin) {
        triggerWhiteFlashTransition(() => {
          sceneBattle.classList.remove('active');
          if (selectedGender === 'male') {
            sceneCutsceneMale.classList.add('active');
          } else {
            sceneCutsceneFemale.classList.add('active');
          }
          currentStep = 'CUTSCENE_READY';
        });
      } else {
        updateKnowledgeBar(-50);
        triggerWhiteFlashTransition(() => {
          sceneBattle.classList.remove('active');
          sceneLeft2.classList.add('active');
          charPakorn.src = 'https://lh3.googleusercontent.com/d/1yVHMdPfZKDjswa0kHjVTQ3qlunJtsyjm';
          charPakorn.classList.add('active');

          textboxImg.src = 'https://lh3.googleusercontent.com/d/1AJHrpm0Qq1Muj4uTroYaDCAGDsDJRjUS';
          textbox.classList.add('active');
          currentStep = 'TXT_NEW_BRANCH_1_1';
        });
      }
    }

    function updateKnowledgeBar(deltaPercent) {
      if (deltaPercent === -50) {
        knowledgeScore = Math.floor(knowledgeScore / 2);
      } else {
        knowledgeScore = Math.min(100, knowledgeScore + deltaPercent);
      }
      knowledgeBar.style.width = knowledgeScore + '%';
    }

    function handleMiddleButtonClick(event) {
      event.stopPropagation();
      if (isTransitioning || currentStep !== 'SCENE_2_MIDDLE_BTN') return;
      isTransitioning = true;
      resetIdleTimer();

      navButtons.classList.remove('active');
      scene2.classList.add('zoom-out-fade');

      setTimeout(() => {
        scene2.classList.remove('active');
        scene2.classList.remove('zoom-out-fade');
        scene6.classList.add('active');

        btnLeft.style.display = 'block';
        btnRight.style.display = 'block';
        btnMiddle.style.display = 'none';
        navButtons.classList.add('active');

        currentStep = 'SCENE_6_BRANCH';
        isTransitioning = false;
        resetIdleTimer();
      }, 700);
    }

    function handleLeftButtonClick(event) {
      event.stopPropagation();
      if (isTransitioning || currentStep !== 'SCENE_6_BRANCH') return;
      isTransitioning = true;
      resetIdleTimer();

      navButtons.classList.remove('active');
      scene6.classList.add('zoom-out-fade');

      setTimeout(() => {
        scene6.classList.remove('active');
        scene6.classList.remove('zoom-out-fade');
        sceneLeft1.classList.add('active');

        btnTalk.classList.add('visible-disabled');

        currentStep = 'LEFT_BRANCH_START';
        isTransitioning = false;
        resetIdleTimer();
      }, 700);
    }

    function handleTalkButtonClick(event) {
      event.stopPropagation();
      if (isTransitioning || currentStep !== 'TALK_BTN_READY') return;
      isTransitioning = true;
      resetIdleTimer();

      btnTalk.classList.remove('interactive');
      btnTalk.classList.remove('visible-disabled');
      sceneLeft1.classList.remove('active');

      setTimeout(() => {
        sceneLeft2.classList.add('active');

        charPakorn.src = 'https://lh3.googleusercontent.com/d/1yVHMdPfZKDjswa0kHjVTQ3qlunJtsyjm';
        charPakorn.classList.add('active');

        currentStep = 'LEFT_BRANCH_2_START';
        isTransitioning = false;
        resetIdleTimer();
      }, 600);
    }

    /* ปุ่ม Home กลับหน้าเริ่มเกม */
    function handleHomeButtonClick(event) {
      if (event) event.stopPropagation();
      
      currentStep = 'SCENE_0';
      selectedGender = '';
      isTransitioning = false;
      completedChoice1 = false;
      completedChoice2 = false;
      activeChoiceBranch = 0;
      currentBranchPath = 0;
      knowledgeScore = 0;
      isBattleActive = false;
      clearInterval(battleInterval);
      clearTimeout(wrongAppTimer);

      btnHome.classList.remove('active');
      tlChoices.classList.remove('active');
      newBranchChoices.classList.remove('active');
      phoneScreen1.classList.remove('active');
      phoneScreen2.classList.remove('active');
      popupScreen1.classList.remove('active');
      popupScreen2.classList.remove('active');
      battleOverlay.classList.remove('active');
      battleScoreHud.classList.remove('active');
      charPakorn.classList.remove('active');
      textbox.classList.remove('active');
      navButtons.classList.remove('active');
      btnTalk.classList.remove('interactive');
      btnTalk.classList.remove('visible-disabled');
      genderSelect.classList.remove('active');
      whiteFlash.classList.remove('active');

      document.querySelectorAll('.battle-floating-item').forEach(el => el.remove());

      const allScenes = [scene0, sceneSp1, sceneSp2, scene1, scene2, scene3, scene4, scene6, sceneLeft1, sceneLeft2, sceneEnd1, sceneBattle, sceneCutsceneMale, sceneCutsceneFemale];
      allScenes.forEach(sc => {
        sc.classList.remove('active', 'zoom-out-fade', 'instant-change');
      });

      scene0.classList.add('active');
      knowledgeBar.style.width = '0%';
      resetIdleTimer();
    }

    resetIdleTimer();
  </script>
