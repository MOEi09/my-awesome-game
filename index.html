<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Novel Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #07070a;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
    }

    /* กรอบหน้าจอเกมสัดส่วน 16:9 (1920x1080) */
    #game-container {
      position: relative;
      width: 100vw;
      height: 56.25vw; /* 16:9 Aspect Ratio */
      max-height: 100vh;
      max-width: 177.78vh;
      background-color: #000;
      overflow: hidden;
      box-shadow: 0 0 45px rgba(0, 0, 0, 0.95);
    }

    /* แถบ HUD วัดความรู้ด้านบนแบบโมเดิร์นคลีน */
    .hud-header {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(18, 18, 30, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.45);
      transition: all 0.4s ease;
    }

    .hud-icon {
      font-size: 22px;
      color: #ffd700;
      display: flex;
      align-items: center;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.5));
    }

    .progress-bar-container {
      width: 220px;
      height: 12px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899, #3b82f6);
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .info-btn-wrapper {
      position: relative;
    }

    .info-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .info-btn:hover {
      background: #ec4899;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(236, 72, 153, 0.8);
    }

    .tooltip {
      position: absolute;
      top: 34px;
      right: 0;
      background: rgba(15, 15, 25, 0.95);
      color: #fff;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
    }

    .info-btn-wrapper:hover .tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* ข้อความ ( แตะ ) ลางๆ อ่านง่ายตรงกลางจอ เมื่อค้างเกิน 4 วินาที */
    .center-tap-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      z-index: 95;
      font-size: 26px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.72);
      letter-spacing: 5px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95), 0 0 22px rgba(236, 72, 153, 0.7);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
    }

    .center-tap-hint.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      animation: tapSoftPulse 2.4s infinite ease-in-out;
    }

    @keyframes tapSoftPulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(0.97);
        opacity: 0.65;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.05);
        opacity: 0.95;
      }
    }

    /* เลเยอร์ฉากหลัง พร้อมระบบครอสเฟดอย่างสมูทนุ่มนวล */
    .scene-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transform: scale(1);
      transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      will-change: opacity, transform;
    }

    .scene-bg.active {
      opacity: 1;
      pointer-events: auto;
    }

    .scene-bg.zoom-out-fade {
      opacity: 0;
      transform: scale(1.15);
    }

    .scene-bg.instant-change {
      transition: none !important;
    }

    /* หน้าเลือกเพศ */
    .gender-select-container {
      position: absolute;
      bottom: 6%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .gender-select-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .gender-select-wrapper {
      width: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gender-btn {
      width: 250px;
      height: auto;
      max-width: 38%;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6));
    }

    .gender-btn:hover {
      transform: scale(1.12);
      filter: drop-shadow(0 12px 28px rgba(236, 72, 153, 0.75));
    }

    .gender-btn:active {
      transform: scale(0.95);
    }

    /* แถบข้อความด้านล่าง (1920x430) */
    .textbox-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 39.8%; /* 430/1080 */
      z-index: 60;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .textbox-container.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .textbox-img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      transition: opacity 0.25s ease;
    }

    /* ปุ่มนำทางกึ่งกลางล่าง */
    .nav-buttons-container {
      position: absolute;
      bottom: 5%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .nav-buttons-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-btn-slot {
      width: 33.33%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .nav-btn {
      max-width: 220px;
      width: 80%;
      height: auto;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 18px rgba(255, 255, 255, 0.65));
      animation: btnSmoothGlow 2.5s infinite ease-in-out;
    }

    @keyframes btnSmoothGlow {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 14px rgba(236, 72, 153, 0.55));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 25px rgba(255, 255, 255, 0.95));
      }
    }

    .nav-btn:hover {
      transform: scale(1.22) !important;
      filter: drop-shadow(0 12px 28px rgba(236, 72, 153, 0.95)) drop-shadow(0 0 32px rgba(255, 255, 255, 1)) !important;
    }

    .nav-btn:active {
      transform: scale(0.93) !important;
    }

    /* ปุ่มพูดคุย (Talk Button - ตำแหน่ง X:1171, Y:333) */
    .talk-btn {
      position: absolute;
      top: 30.83%; /* 333 / 1080 */
      left: 61.00%; /* 1171 / 1920 */
      width: 14%;
      max-width: 220px;
      height: auto;
      z-index: 45;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.6));
    }

    .talk-btn.visible-disabled {
      opacity: 0.7;
      pointer-events: none;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5)) grayscale(0.5);
    }

    .talk-btn.interactive {
      opacity: 1;
      pointer-events: auto;
      animation: talkPulse 2s infinite ease-in-out;
    }

    @keyframes talkPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 8px 20px rgba(236, 72, 153, 0.7)) drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 12px 28px rgba(236, 72, 153, 0.95)) drop-shadow(0 0 25px rgba(255, 255, 255, 1));
      }
    }

    /* ตัวละคร ปกรณ์ (Pakorn Layer - 960x1080 ชิดขวาสุด) */
    .character-pakorn {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%; /* 960 / 1920 */
      height: 100%;
      object-fit: fill;
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .character-pakorn.active {
      opacity: 1;
    }

    /* */
    /* กลุ่มปุ่มเลือกตัวเลือก ตล.1 และ ตล.2 (เรียงตรงกลางลงมา) */
    .tl-choices-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tl-choices-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .tl-choice-btn {
      width: 900px;
      max-width: 68vw;
      height: auto;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease, opacity 0.3s ease;
      filter: drop-shadow(0 8px 22px rgba(0, 0, 0, 0.65));
    }

    .tl-choice-btn:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 10px 25px rgba(236, 72, 153, 0.8));
    }

    .tl-choice-btn:active {
      transform: scale(0.95);
    }

    .tl-choice-btn.disabled {
      opacity: 0.45;
      pointer-events: none;
      filter: grayscale(0.8) drop-shadow(0 4px 10px rgba(0, 0, 0, 0.4));
    }

    /* เลเยอร์จอมือถือ (ครอบทับฉาก) */
    .phone-screen-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 35;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .phone-screen-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* กริดวางแอปบนจอมือถือฝั่งซ้าย */
    .app-icons-grid {
      position: absolute;
      top: 34%;
      left: 5.2%;
      width: 29.5%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px 12px;
      justify-items: center;
      align-items: center;
    }

    .app-icon {
      width: 68%;
      height: auto;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.25s ease;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
    }

    .app-icon:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 6px 16px rgba(255, 255, 255, 0.9));
    }

    .app-icon:active {
      transform: scale(0.92);
    }

    /* จอน้อย Pop-up เด้งขึ้นมาจากล่าง */
    .popup-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 38;
      opacity: 0;
      transform: translateY(12%);
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .popup-screen.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div id="game-container">
    
    <!-- แถบ HUD วัดความรู้ด้านบน -->
    <div class="hud-header">
      <div class="hud-icon">📖</div>
      <div class="progress-bar-container">
        <div id="knowledge-bar" class="progress-bar-fill"></div>
      </div>
      <div class="info-btn-wrapper">
        <div class="info-btn">!</div>
        <div class="tooltip">แก้ปัญหาภายในเกมได้ แถบวัดความรู้จะขยับขึ้น</div>
      </div>
    </div>

    <!-- ข้อความ ( แตะ ) ลางๆ กลางจอเมื่อผู้เล่นค้างเกิน 4 วินาที -->
    <div id="center-tap-hint" class="center-tap-hint">( แตะ )</div>

    <!-- ฉากต่างๆ (Background Scenes) -->
    <div id="scene-0" class="scene-bg active" style="background-image: url('https://lh3.googleusercontent.com/d/1Lk0CVOXS70d9zYJ-lg2F5glhiQ_YOWiT'); cursor: pointer;"></div>
    <div id="scene-sp1" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1Kuzs9rpu0M5NScCdeTSl9dAZEa2aLmjP');"></div>
    <div id="scene-sp2" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1l0LxDM6bw6FYo4xN_cWEOzM8UfIOyvS4');">
      <div id="gender-select" class="gender-select-container">
        <div class="gender-select-wrapper">
          <img src="https://lh3.googleusercontent.com/d/1_kb6brYLqRotQ1OS0Z-DHF5_ybcRouY4" class="gender-btn" alt="เพศชาย" onclick="selectGender('male')">
        </div>
        <div class="gender-select-wrapper">
          <img src="https://lh3.googleusercontent.com/d/1yT_wmTzzaZWrcXI1vRfB8zlxxqABtdxM" class="gender-btn" alt="เพศหญิง" onclick="selectGender('female')">
        </div>
      </div>
    </div>

    <div id="scene-1" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1XitV2u7G101fAkArm4iZja-E-Zn1sIte'); cursor: pointer;"></div>
    <div id="scene-2" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/17Er8rltYRMEcZrDkiJXi6khZ2DxeSVOy'); cursor: pointer;"></div>
    <div id="scene-3" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1MkVKMxnON9c0BBO0B544jEeUgx6AHzC-'); cursor: pointer;"></div>
    <div id="scene-4" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1aUIvEEm4WdVxR6a34qSuKUP9t5p7lUuP'); cursor: pointer;"></div>
    <div id="scene-6" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1JXQa4HTXdUYG7ou90LBHsRZ1PTcF9B9b'); cursor: pointer;"></div>

    <!-- ฉากฝั่งซ้าย -->
    <div id="scene-left1" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/19vPu5aoFrebQdm1DtzvciBHaySg4OJxt'); cursor: pointer;"></div>
    <div id="scene-left2" class="scene-bg" style="background-image: url('https://lh3.googleusercontent.com/d/1R8i9bZv4Gpqyvv5972rX8UDL-IkKpJOF'); cursor: pointer;"></div>

    <!-- เลเยอร์จอมือถือ 1 & 2 -->
    <div id="phone-screen-1" class="phone-screen-overlay" style="background-image: url('https://lh3.googleusercontent.com/d/12a9H6WrV2NlJoaPaEsNX0WXhUtxBrG7e');">
      <div class="app-icons-grid">
        <img src="https://lh3.googleusercontent.com/d/1EjoRnJHXniqpZkq8VYo1yKPKb6e0d9Uh" class="app-icon" alt="แอพ 1" onclick="handleAppClick(1, 1)">
        <img src="https://lh3.googleusercontent.com/d/1YGMwfzN7KmiZqot1m-E4gjKCKk4LNOu0" class="app-icon" alt="แอพ 2" onclick="handleAppClick(1, 2)">
        <img src="https://lh3.googleusercontent.com/d/1w7xHtqSxAsCqY16Kk08Jp_g_ECC8HUNt" class="app-icon" alt="แอพ 3" onclick="handleAppClick(1, 3)">
      </div>
    </div>

    <div id="phone-screen-2" class="phone-screen-overlay" style="background-image: url('https://lh3.googleusercontent.com/d/1lMlokBOI3y44xGSx95igFu3dSJAfAGiu');">
      <div class="app-icons-grid">
        <img src="https://lh3.googleusercontent.com/d/1EjoRnJHXniqpZkq8VYo1yKPKb6e0d9Uh" class="app-icon" alt="แอพ 1" onclick="handleAppClick(2, 1)">
        <img src="https://lh3.googleusercontent.com/d/1YGMwfzN7KmiZqot1m-E4gjKCKk4LNOu0" class="app-icon" alt="แอพ 2" onclick="handleAppClick(2, 2)">
        <img src="https://lh3.googleusercontent.com/d/1w7xHtqSxAsCqY16Kk08Jp_g_ECC8HUNt" class="app-icon" alt="แอพ 3" onclick="handleAppClick(2, 3)">
      </div>
    </div>

    <!-- จอน้อย Pop-up 1 & 2 -->
    <div id="popup-screen-1" class="popup-screen" style="background-image: url('https://lh3.googleusercontent.com/d/1LNkuEzI1QjwZ8nPo0H1sugzR-3-LN1LQ');"></div>
    <div id="popup-screen-2" class="popup-screen" style="background-image: url('https://lh3.googleusercontent.com/d/1s-hsVrRE8J-Hu5XrZBzp39GLAyB7SNbr');"></div>

    <!-- ปุ่มเลือกตัวเลือก ตล.1 และ ตล.2 -->
    <div id="tl-choices" class="tl-choices-container">
      <img id="btn-tl1" class="tl-choice-btn" src="https://lh3.googleusercontent.com/d/1pdC6RZNLfS0dA_zFpwOSd_-vNgUhANuf" alt="ปุ่ม ตล.1" onclick="handleChoiceTL(1)">
      <img id="btn-tl2" class="tl-choice-btn" src="https://lh3.googleusercontent.com/d/1YLSZv1BSIGshI026uZTUl9W6TKVJQMVh" alt="ปุ่ม ตล.2" onclick="handleChoiceTL(2)">
    </div>

    <!-- เลเยอร์ตัวละคร ปกรณ์ (ชิดขวาสุด) -->
    <img id="char-pakorn" class="character-pakorn" src="" alt="ปกรณ์">

    <!-- ปุ่มพูดคุย -->
    <img id="btn-talk" class="talk-btn" src="https://lh3.googleusercontent.com/d/1crku-NyMGhzzsVN8bSb8BoFs3RNaqXN4" alt="พูดคุย" onclick="handleTalkButtonClick(event)">

    <!-- แถบข้อความด้านล่าง -->
    <div id="textbox" class="textbox-container" onclick="handleTextboxClick(event)">
      <img id="textbox-img" class="textbox-img" src="" alt="Textbox">
    </div>

    <!-- ปุ่มควบคุมซ้าย-กลาง-ขวา -->
    <div id="nav-buttons" class="nav-buttons-container">
      <div class="nav-btn-slot">
        <!-- ปุ่มซ้าย -->
        <img id="btn-left" class="nav-btn" src="https://lh3.googleusercontent.com/d/1rXg5ZP84frpJ8wSdmE7s4dk2yiVEA2Y6" alt="Left" onclick="handleLeftButtonClick(event)">
      </div>
      <div class="nav-btn-slot">
        <!-- ปุ่มกลาง -->
        <img id="btn-middle" class="nav-btn" src="https://lh3.googleusercontent.com/d/1xkl3-rlYm4JcyIjCpK9l1JWNQ0JWuQ8E" alt="Middle" onclick="handleMiddleButtonClick(event)">

      centerTapHint.classList.remove('active');
      clearTimeout(idleTimer);
      if (!isTransitioning && currentStep !== 'GENDER_STAGE' && currentStep !== 'WAIT_AUTO_SP1' && currentStep !== 'WAIT_AUTO_SCENE_4' && currentStep !== 'WAIT_APP_SELECTION' && currentStep !== 'SHOW_TL_CHOICES') {
        idleTimer = setTimeout(() => {
          centerTapHint.classList.add('active');
        }, 4000);
      }
    }

    gameContainer.addEventListener('click', () => {
      resetIdleTimer();

    scene0.addEventListener('click', () => {
      if (isTransitioning || currentStep !== 'SCENE_0') return;
      isTransitioning = true;
      resetIdleTimer();

      scene0.classList.remove('active');
      sceneSp1.classList.add('active');
      currentStep = 'WAIT_AUTO_SP1';

      // ค้างฉากพิเศษ 1 ไว้ 4 วินาทีแล้วเลือนเปลี่ยนไปฉากพิเศษ 2

        setTimeout(() => {
          genderSelect.classList.add('active');

      setTimeout(() => {
        sceneSp2.classList.remove('active');
        scene1.classList.add('active');
        currentStep = 'SCENE_1_START';
        isTransitioning = false;
        resetIdleTimer();
      }, 600);

      resetIdleTimer();

        textboxImg.src = 'https://lh3.googleusercontent.com/d/1vKgnY25GF7ayPdywSG7pY7tLH0c3kwVH';

        scene2.classList.add('instant-change');
        scene2.classList.remove('active');
        scene3.classList.add('instant-change');
        scene3.classList.add('active');

        setTimeout(() => {
          scene2.classList.remove('instant-change');
          scene3.classList.remove('instant-change');
        }, 50);

        currentStep = 'TXT_4_SCENE_3';
      }
      else if (currentStep === 'TXT_4_SCENE_3') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1gNsteHUVNCqlTG5UBX2fVVG2OWV2kdja';
        currentStep = 'TXT_5';
      }
      else if (currentStep === 'TXT_5') {
        textbox.classList.remove('active');
        scene3.classList.remove('active');
        scene4.classList.add('active');
        currentStep = 'WAIT_AUTO_SCENE_4';
        isTransitioning = true;

        setTimeout(() => {
          currentStep = 'SCENE_4_WAIT';
          isTransitioning = false;
          resetIdleTimer();
        }, 4000);
      }
      else if (currentStep === 'TXT_6') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1UejuctKbYKqiwwDNj-95z4ObYyp3kR_U';
        currentStep = 'TXT_7';
      }
      else if (currentStep === 'TXT_7') {
        scene4.classList.add('instant-change');
        scene4.classList.remove('active');
        scene3.classList.add('instant-change');
        scene3.classList.add('active');

        setTimeout(() => {
          scene4.classList.remove('instant-change');
          scene3.classList.remove('instant-change');
        }, 50);

        currentStep = 'TXT_7_SCENE_3';
      }
      else if (currentStep === 'TXT_7_SCENE_3') {
        textbox.classList.remove('active');
        scene3.classList.remove('active');
        scene2.classList.add('active');

        btnLeft.style.display = 'none';
        btnRight.style.display = 'none';
        btnMiddle.style.display = 'block';
        navButtons.classList.add('active');

        currentStep = 'SCENE_2_MIDDLE_BTN';

        currentStep = 'TXT_LEFT_2';
      }
      else if (currentStep === 'TXT_LEFT_2') {
        textbox.classList.remove('active');
        btnTalk.classList.remove('visible-disabled');
        btnTalk.classList.add('interactive');
        currentStep = 'TALK_BTN_READY';
      }
      else if (currentStep === 'TXT_LEFT_3') {
        textbox.classList.remove('active');
        charPakorn.src = 'https://lh3.googleusercontent.com/d/1awrxzz7Xyd6VrOV8b2zoLBmz3o8OH_tA';
        currentStep = 'LEFT_BRANCH_PAKORN_NORMAL_1';

      else if (currentStep === 'TXT_LEFT_4') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1AuQQJlo1B1og7hNEoUBFP5j0TzcanwBB';
        charPakorn.src = 'https://lh3.googleusercontent.com/d/1yVHMdPfZKDjswa0kHjVTQ3qlunJtsyjm';
        currentStep = 'TXT_LEFT_5';
      }
      else if (currentStep === 'TXT_LEFT_5') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1uMBohQwM_n512oPv4hizsD0S7si7zYYi';
        charPakorn.src = 'https://lh3.googleusercontent.com/d/1awrxzz7Xyd6VrOV8b2zoLBmz3o8OH_tA';
        currentStep = 'TXT_LEFT_6';
      }
      else if (currentStep === 'TXT_LEFT_6') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1lP2e_ZiwEHh36SGCPpvJCjJRR2RyxhzV';
        currentStep = 'TXT_LEFT_7';
      }
      else if (currentStep === 'TXT_LEFT_7') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1FeW5eMcocC8iBIfFfxEnLZTWuBcnDi3d';
        currentStep = 'TXT_LEFT_END';
      }
      else if (currentStep === 'TXT_LEFT_END') {
        textbox.classList.remove('active');
        showTLChoices();
      }
      // แถบคำถามตล.1 หรือ ตล.2
      else if (currentStep === 'TXT_QUESTION_TL') {
        textbox.classList.remove('active');
        charPakorn.classList.remove('active');

        if (activeChoiceBranch === 1) {
          phoneScreen1.classList.add('active');
        } else if (activeChoiceBranch === 2) {
          phoneScreen2.classList.add('active');
        }

        currentStep = 'WAIT_APP_SELECTION';
      }
      // ปิดแถบข้อความแจ้งเตือนเลือกแอปผิด
      else if (currentStep === 'WRONG_APP_MSG') {
        clearTimeout(wrongAppTimer);
        textbox.classList.remove('active');
        currentStep = 'WAIT_APP_SELECTION';
      }
      // ทางเดินเลือกแอปถูกสำหรับ ตล.1
      else if (currentStep === 'TXT_TL1_CORRECT_1') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/19s4BKLbNuOqJEw6SSfKmEEVY2_Mi25c-';
        currentStep = 'TXT_TL1_CORRECT_2';
      }
      else if (currentStep === 'TXT_TL1_CORRECT_2') {
        textbox.classList.remove('active');
        popupScreen1.classList.remove('active');
        phoneScreen1.classList.remove('active');

        completedChoice1 = true;
        updateKnowledgeBar();

        setTimeout(() => {
          charPakorn.classList.add('active');
          checkChoiceCompletion();
        }, 500);
      }
      // ทางเดินเลือกแอปถูกสำหรับ ตล.2
      else if (currentStep === 'TXT_TL2_CORRECT_1') {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1n3Uhf75eITtQeE9Eayd8OqhNFJ2LsIlX';
        currentStep = 'TXT_TL2_CORRECT_2';
      }

        textboxImg.src = 'https://lh3.googleusercontent.com/d/17ViaK3xMirpKrlYKVNGEc03Db-s82v4m';
        currentStep = 'TXT_TL2_CORRECT_3';

        popupScreen2.classList.remove('active');
        phoneScreen2.classList.remove('active');

        completedChoice2 = true;
        updateKnowledgeBar();

        setTimeout(() => {
          charPakorn.classList.add('active');
          checkChoiceCompletion();
        }, 500);
      }
      // แถบข้อความสุดท้ายก่อนขึ้น 2 ตัวเลือกถัดไป
      else if (currentStep === 'FINAL_TXT_BEFORE_CHOICES') {
        // จบตามขอบเขตที่ระบุ
      }
    }

    // แสดงปุ่ม ตล.1 และ ตล.2
    function showTLChoices() {
      currentStep = 'SHOW_TL_CHOICES';
      
      if (completedChoice1) {
        btnTl1.classList.add('disabled');
      } else {
        btnTl1.classList.remove('disabled');
      }

      if (completedChoice2) {
        btnTl2.classList.add('disabled');
      } else {
        btnTl2.classList.remove('disabled');
      }

      tlChoices.classList.add('active');
    }

    // เลือกปุ่ม ตล.1 หรือ ตล.2
    function handleChoiceTL(choiceNum) {
      if (isTransitioning) return;
      if (choiceNum === 1 && completedChoice1) return;
      if (choiceNum === 2 && completedChoice2) return;

      activeChoiceBranch = choiceNum;
      tlChoices.classList.remove('active');

      setTimeout(() => {
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1gCxxcGNJww9_a8wVNveWP63PCd3x570U';
        textbox.classList.add('active');
        currentStep = 'TXT_QUESTION_TL';
      }, 400);
    }

    // จัดการการคลิกเลือกแอปบนจอมือถือ
    function handleAppClick(branch, appNum) {
      if (isTransitioning || currentStep !== 'WAIT_APP_SELECTION') return;

      if (branch === 1) { // สาขา ตล.1
        if (appNum === 3) { // แอป 3 คือแอปที่ถูกต้อง
          popupScreen1.classList.add('active');
          textboxImg.src = 'https://lh3.googleusercontent.com/d/1pnhZ0aiy7JYPgEF-JiuTsUxA5Tk7djdK';
          textbox.classList.add('active');
          currentStep = 'TXT_TL1_CORRECT_1';
        } else { // แอป 1 และ 2 เลือกผิด
          showWrongAppNotice();
        }
      } 
      else if (branch === 2) { // สาขา ตล.2
        if (appNum === 2) { // แอป 2 คือแอปที่ถูกต้อง
          popupScreen2.classList.add('active');
          textboxImg.src = 'https://lh3.googleusercontent.com/d/1RLnopjABjKI5OtN42fucpA8fZ1SC9zr3';
          textbox.classList.add('active');
          currentStep = 'TXT_TL2_CORRECT_1';
        } else { // แอป 1 และ 3 เลือกผิด
          showWrongAppNotice();
        }
      }
    }

    // แสดงการแจ้งเตือนเมื่อเลือกแอปผิด ค้างไว้ 2 วินาที
    function showWrongAppNotice() {
      textboxImg.src = 'https://lh3.googleusercontent.com/d/10cfQvccibUCVWX3dsS8DXqeenMqDRgzx';
      textbox.classList.add('active');
      currentStep = 'WRONG_APP_MSG';

      clearTimeout(wrongAppTimer);
      wrongAppTimer = setTimeout(() => {
        if (currentStep === 'WRONG_APP_MSG') {
          textbox.classList.remove('active');
          currentStep = 'WAIT_APP_SELECTION';
        }
      }, 2000);
    }

    // ตรวจสอบสถานะการทำครบทั้งสองทาง
    function checkChoiceCompletion() {
      if (completedChoice1 && completedChoice2) {
        // เมื่อทำครบทั้ง ตล.1 และ ตล.2 แล้ว แสดงแถบข้อความสุดท้าย
        textboxImg.src = 'https://lh3.googleusercontent.com/d/1CBfWBhQVU9kPGLcTGsK9v_K6NB5xvKdn';
        textbox.classList.add('active');
        currentStep = 'FINAL_TXT_BEFORE_CHOICES';
      } else {
        // หากยังทำไม่ครบ วนกลับไปหน้าเลือกปุ่ม ตล.1/ตล.2 อีกครั้ง
        showTLChoices();
      }
    }

    // ปรับเพิ่มความจุหลอดความรู้ HUD
    function updateKnowledgeBar() {
      let percent = 0;
      if (completedChoice1) percent += 50;
      if (completedChoice2) percent += 50;
      knowledgeBar.style.width = percent + '%';
    }

    // คลิกปุ่มตรงกลาง (ในฉาก 2) ➔ ซูมเลือนหายไปฉาก 6
    function handleMiddleButtonClick(event) {
      event.stopPropagation();
      if (isTransitioning || currentStep !== 'SCENE_2_MIDDLE_BTN') return;
      isTransitioning = true;
      resetIdleTimer();

      navButtons.classList.remove('active');
      scene2.classList.add('zoom-out-fade');

      setTimeout(() => {
        scene2.classList.remove('active');
        scene2.classList.remove('zoom-out-fade');
        scene6.classList.add('active');

        btnLeft.style.display = 'block';
        btnRight.style.display = 'block';
        btnMiddle.style.display = 'none';
        navButtons.classList.add('active');

        currentStep = 'SCENE_6_BRANCH';
        isTransitioning = false;
        resetIdleTimer();
      }, 700);
    }

    // คลิกปุ่มทางซ้าย (ในฉาก 6) ➔ ซูมเลือนหายไปฉากซ้าย 1
    function handleLeftButtonClick(event) {
      event.stopPropagation();
      if (isTransitioning || currentStep !== 'SCENE_6_BRANCH') return;
      isTransitioning = true;
      resetIdleTimer();

      navButtons.classList.remove('active');
      scene6.classList.add('zoom-out-fade');

      setTimeout(() => {
        scene6.classList.remove('active');
        scene6.classList.remove('zoom-out-fade');
        sceneLeft1.classList.add('active');

        btnTalk.classList.add('visible-disabled');

        currentStep = 'LEFT_BRANCH_START';
        isTransitioning = false;
        resetIdleTimer();
      }, 700);
    }

    // คลิกปุ่มพูดคุย ➔ ฉากซ้าย 1 เลือนหายไปฉากซ้าย 2 (แสดงปกรณ์หน้าเศร้า)
    function handleTalkButtonClick(event) {
      event.stopPropagation();
      if (isTransitioning || currentStep !== 'TALK_BTN_READY') return;
      isTransitioning = true;
      resetIdleTimer();

      btnTalk.classList.remove('interactive');
      btnTalk.classList.remove('visible-disabled');
      sceneLeft1.classList.remove('active');

      setTimeout(() => {
        sceneLeft2.classList.add('active');

        charPakorn.src = 'https://lh3.googleusercontent.com/d/1yVHMdPfZKDjswa0kHjVTQ3qlunJtsyjm';
        charPakorn.classList.add('active');

        currentStep = 'LEFT_BRANCH_2_START';
        isTransitioning = false;
        resetIdleTimer();
      }, 600);
    }

    resetIdleTimer();
  </script>
</body>
</html>
